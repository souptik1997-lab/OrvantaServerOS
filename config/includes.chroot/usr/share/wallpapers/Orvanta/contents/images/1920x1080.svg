<?xml version="1.0" encoding="UTF-8"?>
<!-- ORVANTA default wallpaper, 16:9. Kept to SVG Tiny features (gradients,
     shapes, opacity) so Plasma's Qt SVG renderer draws it exactly; no filters
     or text. 1920x1200.svg is the same artwork for 16:10.
     SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050f20"/>
      <stop offset="0.55" stop-color="#0a2245"/>
      <stop offset="1" stop-color="#0d3563"/>
    </linearGradient>
    <radialGradient id="glow" cx="1340" cy="500" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f8fd6" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#1f8fd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1f8fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="1340" cy="500" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee7f5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5ee7f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="1110" y1="270" x2="1570" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee7f5"/>
      <stop offset="1" stop-color="#1f8fd6"/>
    </linearGradient>
    <radialGradient id="moon" cx="1625" cy="335" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee7f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5ee7f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- orbits -->
  <g transform="translate(1340 500) rotate(-28)" fill="none">
    <ellipse rx="900" ry="300" stroke="#2bb5c8" stroke-opacity="0.07" stroke-width="2"/>
    <ellipse rx="640" ry="214" stroke="#2bb5c8" stroke-opacity="0.22" stroke-width="5"/>
  </g>
  <!-- ring -->
  <circle cx="1340" cy="500" r="300" fill="url(#core)"/>
  <circle cx="1340" cy="500" r="205" fill="none" stroke="url(#ring)" stroke-width="72" stroke-opacity="0.92"/>
  <!-- moon -->
  <circle cx="1625" cy="335" r="60" fill="url(#moon)"/>
  <circle cx="1625" cy="335" r="30" fill="#5ee7f5"/>
  <!-- faint stars -->
  <g fill="#cfe9ff">
    <circle cx="212" cy="164" r="2" fill-opacity="0.45"/>
    <circle cx="418" cy="96" r="1.5" fill-opacity="0.35"/>
    <circle cx="640" cy="242" r="1.5" fill-opacity="0.3"/>
    <circle cx="884" cy="132" r="2" fill-opacity="0.4"/>
    <circle cx="1046" cy="58" r="1.5" fill-opacity="0.3"/>
    <circle cx="1802" cy="122" r="2" fill-opacity="0.4"/>
    <circle cx="1748" cy="842" r="1.5" fill-opacity="0.3"/>
    <circle cx="156" cy="612" r="1.5" fill-opacity="0.3"/>
    <circle cx="352" cy="868" r="2" fill-opacity="0.35"/>
    <circle cx="736" cy="702" r="1.5" fill-opacity="0.25"/>
    <circle cx="1012" cy="934" r="1.5" fill-opacity="0.3"/>
    <circle cx="520" cy="452" r="1" fill-opacity="0.4"/>
  </g>
</svg>
