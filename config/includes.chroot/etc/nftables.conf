#!/usr/sbin/nft -f
# ORVANTA OS 0.1 live-session firewall.
# Default: deny unsolicited inbound traffic, allow all outbound traffic.
# Uses its own table instead of 'flush ruleset' so rules added by other
# software (for example Docker, if an administrator enables it) are not wiped.

table inet orvanta_filter
delete table inet orvanta_filter

table inet orvanta_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        # ICMP/ICMPv6 needed for path-MTU discovery and IPv6 neighbour discovery.
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # DHCPv6 client replies from link-local servers.
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
