name: Validate ORVANTA source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # NET_ADMIN only for the container's own network namespace, so "nft -c"
      # can validate the live firewall ruleset.
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v7
      - name: Install validation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper debian-archive-keyring devscripts \
            desktop-file-utils git grub-common librsvg2-bin lintian live-build nftables python3 \
            python3-pyside6.qtwidgets shellcheck
      - name: Static checks (shell, Python, unit tests, desktop entries, branding, GRUB, firewall, live-build config)
        env:
          ORVANTA_REQUIRE_NFT: "1"
          ORVANTA_REQUIRE_BRANDING: "1"
        run: ./scripts/validate.sh
      - name: Verify Debian 13 package availability (main contrib non-free-firmware)
        run: ./scripts/check-packages.sh
      - name: Build Control Center package
        run: |
          cd orvanta-control-center
          dpkg-checkbuilddeps
          dpkg-buildpackage --no-sign
      - name: Lintian
        run: lintian --pedantic --fail-on error,warning orvanta-control-center_*.changes
      - name: Install Control Center package
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./orvanta-control-center_*.deb
          test -x /usr/bin/orvanta-control-center
          dpkg-query -W -f='${Status}\n' orvanta-control-center | grep -qx 'install ok installed'
          QT_QPA_PLATFORM=offscreen timeout 5 orvanta-control-center || [ $? -eq 124 ]
