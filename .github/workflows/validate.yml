name: Validate ORVANTA source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential debhelper devscripts desktop-file-utils live-build python3 python3-pyside6.qtwidgets shellcheck
      - name: Validate shell syntax and style
        run: |
          sh -n auto/build auto/clean auto/config scripts/build.sh scripts/check-host.sh scripts/clean.sh
          shellcheck auto/build auto/clean auto/config scripts/build.sh scripts/check-host.sh scripts/clean.sh
      - name: Validate Python syntax
        run: python3 -m py_compile orvanta-control-center/src/orvanta_control_center.py
      - name: Validate desktop entry
        run: desktop-file-validate orvanta-control-center/data/orvanta-control-center.desktop
      - name: Validate live-build configuration
        run: |
          mkdir -p /tmp/orvanta-live
          cp -a auto config /tmp/orvanta-live/
          cd /tmp/orvanta-live
          ./auto/config
      - name: Verify Trixie package availability
        run: |
          grep -Ev '^[[:space:]]*(#|$)' config/package-lists/orvanta-desktop.list.chroot | xargs -r apt-get install --simulate --yes
      - name: Build Control Center package
        run: |
          cd orvanta-control-center
          dpkg-checkbuilddeps
          dpkg-buildpackage --no-sign
      - name: Install Control Center package
        run: |
          apt-get install -y ./orvanta-control-center_*.deb
          test -x /usr/bin/orvanta-control-center
          dpkg-query -W -f='${Status}\n' orvanta-control-center | grep -qx 'install ok installed'
