<?xml version="1.0" encoding="UTF-8"?>
<!-- ORVANTA wordmark: logo mark above "ORVANTA" and "OS", for dark backgrounds.
     Source for the login-screen, Plasma-splash and boot-splash logos;
     scripts/render-artwork.py renders it to PNG (fonts: DejaVu Sans).
     SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7f5"/>
      <stop offset="1" stop-color="#1f8fd6"/>
    </linearGradient>
  </defs>
  <g transform="translate(280 105)">
    <ellipse rx="112" ry="43" fill="none" stroke="#2bb5c8" stroke-opacity="0.5"
             stroke-width="7" transform="rotate(-28)"/>
    <circle r="66" fill="none" stroke="url(#ring)" stroke-width="25"/>
    <circle cx="87" cy="-46" r="14.5" fill="#5ee7f5"/>
  </g>
  <text x="280" y="270" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold"
        font-size="64" letter-spacing="15" fill="#ffffff">ORVANTA</text>
  <text x="280" y="314" text-anchor="middle" font-family="DejaVu Sans" font-size="22"
        letter-spacing="10" fill="#8fb4d9">OPERATING SYSTEM</text>
</svg>
